[project]
name = "harness-cli"
version = "0.1.0"
description = "Terminal front-end for the Meta-Harness memory system found in the midterm run"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    # Same runtime as harness_lab/text_classification, so the evaluated code runs unchanged
    "datasets",
    "litellm==1.84.10",
    "openai-harmony",
    "tenacity>=8",
    "tqdm",
]

[project.scripts]
harness-cli = "harness_cli.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_cli"]
